<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="ui-monospace, Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="h" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a6172"/>
    </marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect width="960" height="380" fill="#070d12"/>
  <text x="480" y="30" text-anchor="middle" fill="#dbe7f0" font-size="15" font-weight="bold">RepoMedic — topology on the TrueForge harness</text>

  <!-- You -->
  <rect x="20" y="150" width="130" height="64" rx="12" fill="#101a24" stroke="#1b2a38"/>
  <text x="85" y="178" text-anchor="middle" fill="#dbe7f0" font-size="14">You 👤</text>
  <text x="85" y="198" text-anchor="middle" fill="#7d93a8" font-size="11">Allow / Deny</text>

  <!-- TrueForge harness -->
  <rect x="210" y="80" width="250" height="204" rx="14" fill="#0c141c" stroke="url(#h)" stroke-width="1.5"/>
  <text x="335" y="108" text-anchor="middle" fill="#22d3ee" font-size="13" font-weight="bold">TrueForge harness</text>
  <text x="335" y="134" text-anchor="middle" fill="#7d93a8" font-size="11">model loop · sessions · context</text>
  <text x="335" y="154" text-anchor="middle" fill="#7d93a8" font-size="11">dynamic subagents</text>
  <text x="335" y="174" text-anchor="middle" fill="#7d93a8" font-size="11">skills · Generative UI</text>
  <rect x="234" y="196" width="202" height="66" rx="9" fill="rgba(251,191,36,.07)" stroke="#fbbf24" stroke-dasharray="4 3"/>
  <text x="335" y="222" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="bold">⛔ human checkpoint</text>
  <text x="335" y="240" text-anchor="middle" fill="#b09158" font-size="10.5">every write freezes until Allow</text>

  <!-- repomedic-tools -->
  <rect x="520" y="96" width="220" height="172" rx="12" fill="#101a24" stroke="#34d399"/>
  <text x="630" y="124" text-anchor="middle" fill="#34d399" font-size="13" font-weight="bold">repomedic-tools (MCP)</text>
  <text x="630" y="148" text-anchor="middle" fill="#7d93a8" font-size="11">11 read-only scanners</text>
  <text x="630" y="168" text-anchor="middle" fill="#7d93a8" font-size="11">· health · CI classifier · deps</text>
  <text x="630" y="188" text-anchor="middle" fill="#7d93a8" font-size="11">· links · community · bus factor</text>
  <text x="630" y="208" text-anchor="middle" fill="#7d93a8" font-size="11">· release drift · priorities</text>
  <text x="630" y="232" text-anchor="middle" fill="#fbbf24" font-size="11">2 gated writers</text>
  <text x="630" y="252" text-anchor="middle" fill="#54697c" font-size="10.5">allow-list enforced server-side</text>

  <!-- GitHub -->
  <rect x="800" y="140" width="140" height="84" rx="12" fill="#101a24" stroke="#1b2a38"/>
  <text x="870" y="172" text-anchor="middle" fill="#dbe7f0" font-size="14">GitHub 🐙</text>
  <text x="870" y="192" text-anchor="middle" fill="#7d93a8" font-size="11">issues · actions · files</text>

  <!-- Sandbox -->
  <rect x="210" y="308" width="250" height="52" rx="12" fill="#101a24" stroke="#1b2a38"/>
  <text x="335" y="330" text-anchor="middle" fill="#dbe7f0" font-size="12.5">🧪 Sandbox (Daytona)</text>
  <text x="335" y="348" text-anchor="middle" fill="#7d93a8" font-size="10.5">fix verification before reporting</text>

  <!-- arrows -->
  <line x1="150" y1="182" x2="206" y2="182" stroke="#4a6172" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <line x1="460" y1="160" x2="516" y2="160" stroke="#4a6172" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="488" y="150" text-anchor="middle" fill="#54697c" font-size="10">MCP</text>
  <line x1="740" y1="170" x2="796" y2="170" stroke="#4a6172" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="768" y="160" text-anchor="middle" fill="#54697c" font-size="10">REST</text>
  <line x1="335" y1="284" x2="335" y2="304" stroke="#4a6172" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <!-- approval arrow back to You -->
  <path d="M 234 229 C 120 260, 60 240, 62 218" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowA)"/>
  <text x="118" y="272" text-anchor="middle" fill="#fbbf24" font-size="10.5">the pause</text>
</svg>
